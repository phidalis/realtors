
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Realty Homes</title>
  <meta name="description" content="Sign in to your Realty Homes account. Clients and admins log in here.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="index.html" class="logo">
      <span class="logo-mark"><img src="realtor.jpeg" alt="Realty Homes"></span><span class="logo-text">Realty<span>Homes</span></span>
    </a>
    <a href="index.html" class="btn btn-soft btn-sm">Back to Home</a>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card-head">
        <h2 id="auth-title">Welcome back</h2>
        <p id="auth-subtitle">Sign in to your dashboard.</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <p class="auth-reset-msg auth-err" id="auth-error" hidden></p>
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
        <div class="field"><label>Password</label><div class="password-field"><input type="password" name="password" required placeholder="••••••••"><button type="button" class="password-toggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><a href="#" class="auth-forgot" id="auth-forgot">Forgot password?</a></div>
        <button class="btn btn-primary btn-block" type="submit">Sign In</button>
      </form>

      <form id="reset-form" class="auth-form" novalidate hidden>
        <p class="auth-reset-info">Enter the email address linked to your account and we'll send you a link to reset your password.</p>
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
        <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
        <p class="auth-reset-msg" id="reset-msg" hidden></p>
        <p class="auth-alt"><a href="#" id="reset-back">Back to sign in</a></p>
      </form>

      <p class="auth-alt" id="auth-alt">Don't have an account? <a href="signup.html">Create one</a></p>
    </div>
  </main>

  <footer class="auth-footer">
    <span>© 2026 Realty Homes. All rights reserved.</span>
    <span class="auth-footer-links"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a></span>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="site.js"></script>
  <script>
    (function () {
      'use strict';
      const F = window.Firebase;

      function friendly(code) {
        const map = {
          'auth/invalid-credential': 'Incorrect email or password. Try again.',
          'auth/user-not-found': 'No account found with that email.',
          'auth/wrong-password': 'Incorrect password. Try again.',
          'auth/invalid-email': 'Enter a valid email address.',
          'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
          'auth/network-request-failed': 'Network error — check your connection and try again.',
        };
        return map[code] || ('Sign in failed: ' + (code || 'unknown error'));
      }

      const errEl = document.getElementById('auth-error');
      function showErr(msg) {
        if (!errEl) return;
        errEl.textContent = msg;
        errEl.hidden = false;
      }

      document.getElementById('login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());
        if (errEl) { errEl.hidden = true; errEl.textContent = ''; }
        const btn = e.target.querySelector('button[type="submit"]');
        if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
        F.signIn((data.email || '').trim(), data.password || '').then(function () {
          const rec = F.userState.record || {};
          location.href = rec.role === 'admin' ? 'admin.html' : 'client.html';
        }).catch(function (err) {
          showErr(friendly(err && err.code));
          if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
        });
      });

      var forgotLink = document.getElementById('auth-forgot');
      var loginForm = document.getElementById('login-form');
      var resetForm = document.getElementById('reset-form');
      var resetMsg = document.getElementById('reset-msg');
      var authTitle = document.getElementById('auth-title');
      var authSub = document.getElementById('auth-subtitle');

      function setResetMode(on) {
        loginForm.hidden = on;
        resetForm.hidden = !on;
        document.getElementById('auth-alt').hidden = on;
        authTitle.textContent = on ? 'Reset password' : 'Welcome back';
        authSub.textContent = on
          ? 'Enter your account email and we\u2019ll send you a reset link.'
          : 'Sign in to your dashboard.';
      }

      if (forgotLink) forgotLink.addEventListener('click', function (e) {
        e.preventDefault();
        resetMsg.hidden = true;
        resetMsg.textContent = '';
        setResetMode(true);
      });

      document.getElementById('reset-back').addEventListener('click', function (e) {
        e.preventDefault();
        resetMsg.hidden = true;
        resetMsg.textContent = '';
        setResetMode(false);
      });

      if (resetForm) resetForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = new FormData(resetForm).get('email');
        var btn = resetForm.querySelector('button[type="submit"]');
        resetMsg.hidden = false;
        resetMsg.textContent = 'Sending reset link…';
        if (btn) btn.disabled = true;
        F.sendPasswordReset((email || '').trim()).then(function () {
          resetMsg.textContent = 'If an account exists for ' + email + ', a reset link is on its way. Check your inbox.';
          if (btn) btn.disabled = false;
        }).catch(function (err) {
          resetMsg.textContent = friendly(err && err.code);
          if (btn) btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
