<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Realty Homes</title>
  <meta name="description" content="Create a Realty Homes account and get straight into your dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="index.html" class="logo">
      <span class="logo-mark"><img src="realtor.jpeg" alt="Realty Homes"></span><span class="logo-text">Realty<span>Homes</span></span>
    </a>
    <a href="index.html" class="btn btn-soft btn-sm">Back to Home</a>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-card-head">
        <h2>Create your account</h2>
        <p>Create an account to manage your homes and your dashboard.</p>
      </div>

      <form id="signup-form" class="auth-form" novalidate>
        <div class="field"><label>Full name</label><input name="name" required placeholder="Jane Smith"></div>
        <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@email.com"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required placeholder="••••••••" minlength="6"></div>
        <button class="btn btn-primary btn-block" type="submit">Create Account</button>
      </form>

      <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <footer class="auth-footer">
    <span>© 2026 Realty Homes. All rights reserved.</span>
    <span class="auth-footer-links"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a></span>
  </footer>

  <script src="site.js"></script>
  <script>
    (function () {
      const D = window.Dash || {};

      function registerUser(u) {
        if (!D.getStore || !D.setStore) return;
        const users = D.getStore('realtor_users');
        if (!users.some(function (x) { return String(x.email || '').toLowerCase() === String(u.email || '').toLowerCase(); })) {
          users.push({ email: u.email, name: u.name, role: u.role, at: Date.now() });
          D.setStore('realtor_users', users);
        }
      }
      function go(u) {
        registerUser(u);
        if (D.saveUser) D.saveUser(u);
        location.href = u.role === 'admin' ? 'admin.html' : 'client.html';
      }
      function fallback(email, name) {
        return { name: name || 'Guest', email: email || '', role: 'client', at: Date.now() };
      }

      document.getElementById('signup-form').addEventListener('submit', function (e) {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target).entries());
        const u = D.makeUser ? D.makeUser(data.email, data.name, data.password) : fallback(data.email, data.name);
        go(u);
      });
    })();
  </script>
</body>
</html>
